{% extends "base.html" %}

{% block title %}Sign In - INVENTO AI{% endblock %}

{% block content %}
<div class="auth-container">
    {% include "_auth_brand.html" %}
    <section class="auth-side">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome to <span class="highlight">INVENTO AI</span></h2>
                <p>Sign in with your email to manage inventory and billing.</p>
            </div>
            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autofocus autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block"><span>Sign in</span> <i class="fa-solid fa-arrow-right"></i></button>
            </form>
            <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
            <div class="auth-demo-hint">
                <i class="fa-solid fa-key"></i>
                <span>Demo login: <code>admin@invento.ai</code> / <code>admin123</code></span>
            </div>
        </div>
    </section>
</div>
{% endblock %}
